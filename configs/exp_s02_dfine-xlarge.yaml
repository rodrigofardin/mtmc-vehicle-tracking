# Experimento: detector dfine-xlarge no S02 (mesmos Re-ID/limiares/tracker; só o detector muda)
extends: s02_cityflow.yaml
detector:
  type: dfine
  name: dfine-xlarge
  hf: ustc-community/dfine-xlarge-coco
  size: [640, 640]
  models_dir: models
  device: cuda:0
  conf: 0.25
  classes: [car, motorcycle, bus, truck]
processing: {reuse_detections: true}
server: {live_association: {enabled: false}}
output: {dir: "../outputs/exp/s02_dfine-xlarge"}
