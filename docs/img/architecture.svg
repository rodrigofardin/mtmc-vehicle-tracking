<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" role="img" aria-label="MTMC architecture: videos to detector, tracker, tracklets, re-identification, global association, API and monitor">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7dd3e8"/>
    </marker>
    <style>
      .box { fill: #1c2128; stroke: #3b4452; stroke-width: 1.2; rx: 8; }
      .hot { fill: #10303a; stroke: #4cc3dd; stroke-width: 1.4; rx: 8; }
      .t1 { font: 600 13px 'Segoe UI', Arial, sans-serif; fill: #f0f3f6; }
      .t2 { font: 11px 'Segoe UI', Arial, sans-serif; fill: #9aa7b4; }
      .lbl { font: 600 11px 'Segoe UI', Arial, sans-serif; fill: #7dd3e8; letter-spacing: .06em; }
      .ln { stroke: #7dd3e8; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    </style>
  </defs>
  <rect width="1100" height="330" rx="12" fill="#0d1117"/>

  <text class="lbl" x="30" y="30">OFFLINE PIPELINE &#183; LIVE SERVICE</text>

  <rect class="box" x="30"  y="50" width="150" height="62"/><text class="t1" x="42" y="76">Videos + metadata</text><text class="t2" x="42" y="96">cam_timestamp &#183; framenum</text>
  <rect class="box" x="215" y="50" width="150" height="62"/><text class="t1" x="227" y="76">Time alignment</text><text class="t2" x="227" y="96">t_global = t_local + offset</text>
  <rect class="hot" x="400" y="50" width="160" height="62"/><text class="t1" x="412" y="76">Detector</text><text class="t2" x="412" y="96">YOLO / RF-DETR / D-FINE &#183; TRT</text>
  <rect class="box" x="595" y="50" width="150" height="62"/><text class="t1" x="607" y="76">ByteTrack</text><text class="t2" x="607" y="96">one tracker per camera</text>
  <rect class="box" x="780" y="50" width="150" height="62"/><text class="t1" x="792" y="76">Tracklets</text><text class="t2" x="792" y="96">boxes &#183; crops &#183; times</text>

  <path class="ln" d="M180 81 H213"/>
  <path class="ln" d="M365 81 H398"/>
  <path class="ln" d="M560 81 H593"/>
  <path class="ln" d="M745 81 H778"/>
  <path class="ln" d="M855 112 V150 H700"/>

  <rect class="hot" x="540" y="150" width="160" height="62"/><text class="t1" x="552" y="176">Re-ID (OSNet-AIN)</text><text class="t2" x="552" y="196">fine-tuned &#183; ONNX Runtime</text>
  <rect class="box" x="355" y="150" width="150" height="62"/><text class="t1" x="367" y="176">Ground plane</text><text class="t2" x="367" y="196">homography &#8594; metres</text>
  <rect class="hot" x="150" y="150" width="170" height="62"/><text class="t1" x="162" y="176">Global association</text><text class="t2" x="162" y="196">learned pair scorer + clustering</text>

  <path class="ln" d="M540 181 H507"/>
  <path class="ln" d="M355 181 H322"/>

  <path class="ln" d="M235 212 V262"/>
  <rect class="box" x="30"  y="262" width="170" height="50"/><text class="t1" x="42" y="284">Metrics &#183; evidence</text><text class="t2" x="42" y="302">IDF1 &#183; association logs</text>
  <rect class="box" x="235" y="262" width="190" height="50"/><text class="t1" x="247" y="284">FastAPI + WebSocket</text><text class="t2" x="247" y="302">frames + detections + gid</text>
  <rect class="hot" x="470" y="262" width="210" height="50"/><text class="t1" x="482" y="284">React monitor (nginx)</text><text class="t2" x="482" y="302">drag &amp; drop &#183; models &amp; thresholds</text>
  <path class="ln" d="M235 237 H115 V260"/>
  <path class="ln" d="M425 287 H468"/>
</svg>
